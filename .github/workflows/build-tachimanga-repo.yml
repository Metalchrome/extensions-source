name: Build Punk Records Tachimanga Repo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Prepare module files, icons & 1.4 build logic
        run: |
          SAMPLE_RES=$(find src -maxdepth 3 -name "res" -type d | head -n 1)
          cp -r "$SAMPLE_RES" /tmp/sample_res
          rm -f /tmp/sample_res/web_hi_res_512.png

          COMMIT_20015=$(git log --grep="20015" -n 1 --format="%H" || true)
          if [ -n "$COMMIT_20015" ]; then
            git checkout "${COMMIT_20015}~1" -- compiler common core gradle build.gradle.kts settings.gradle.kts gradle.properties
          fi

          rm -rf src/*
          mkdir -p src/fr/punkrecords/src/eu/kanade/tachiyomi/extension/fr/punkrecords
          cp -r /tmp/sample_res src/fr/punkrecords/res

          cat << 'EOF' > src/fr/punkrecords/build.gradle.kts
          import io.github.keiyoushi.gradle.api.ContentWarning

          plugins {
              alias(kei.plugins.extension)
          }

          keiyoushi {
              name = "Punk Records"
              versionCode = 2
              contentWarning = ContentWarning.SAFE
              libVersion = "1.4"

              source {
                  lang = "fr"
                  baseUrl = "https://punkrecordz.com"
              }
          }
          EOF

          cat << 'EOF' > src/fr/punkrecords/src/eu/kanade/tachiyomi/extension/fr/punkrecords/PunkRecords.kt
          package eu.kanade.tachiyomi.extension.fr.punkrecords

          import eu.kanade.tachiyomi.network.GET
          import eu.kanade.tachiyomi.source.model.Filter
          import eu.kanade.tachiyomi.source.model.FilterList
          import eu.kanade.tachiyomi.source.model.MangasPage
          import eu.kanade.tachiyomi.source.model.Page
          import eu.kanade.tachiyomi.source.model.SChapter
          import eu.kanade.tachiyomi.source.model.SManga
          import eu.kanade.tachiyomi.source.online.HttpSource
          import keiyoushi.annotation.Source
          import okhttp3.HttpUrl.Companion.toHttpUrl
          import okhttp3.Request
          import okhttp3.Response
          import org.jsoup.Jsoup
          import org.jsoup.nodes.Document
          import java.text.SimpleDateFormat
          import java.util.Locale
          import java.util.TimeZone
          import java.util.concurrent.Callable
          import java.util.concurrent.Executors

          @Source
          abstract class PunkRecords : HttpSource() {

              override val supportsLatest = true

              override fun headersBuilder() = super.headersBuilder()
                  .add("Referer", "$baseUrl/")

              // ============================== Popular ===============================

              override fun popularMangaRequest(page: Int): Request =
                  GET("$baseUrl/catalogue", headers)

              override fun popularMangaParse(response: Response): MangasPage {
                  val doc = response.asJsoupDoc()
                  val mangas = parseCatalogueFromDom(doc).ifEmpty {
                      parseCatalogueFromRsc(extractNextRscPayload(doc))
                  }
                  return MangasPage(mangas, hasNextPage = false)
              }

              // =============================== Latest ===============================

              override fun latestUpdatesRequest(page: Int): Request =
                  GET("$baseUrl/catalogue?sort=updated", headers)

              override fun latestUpdatesParse(response: Response): MangasPage =
                  popularMangaParse(response)

              // =============================== Search ===============================

              override fun searchMangaRequest(page: Int, query: String, filters: FilterList): Request {
                  val url = "$baseUrl/catalogue".toHttpUrl().newBuilder()
                  if (query.isNotBlank()) {
                      url.addQueryParameter("q", query.trim())
                  }
                  filters.forEach { filter ->
                      if (filter is SortFilter) {
                          val sortValue = filter.toUriPart()
                          if (sortValue.isNotEmpty()) {
                              url.addQueryParameter("sort", sortValue)
                          }
                      }
                  }
                  return GET(url.build(), headers)
              }

              override fun searchMangaParse(response: Response): MangasPage {
                  val page = popularMangaParse(response)
                  val requestUrl = response.request.url
                  val query = requestUrl.queryParameter("q")?.trim().orEmpty()
                  val sort = requestUrl.queryParameter("sort").orEmpty()

                  var filtered = page.mangas
                  if (query.isNotEmpty()) {
                      filtered = filtered.filter { manga ->
                          manga.title.contains(query, ignoreCase = true)
                      }
                  }
                  if (sort == "alpha") {
                      filtered = filtered.sortedBy { it.title.lowercase(Locale.FRENCH) }
                  }
                  return MangasPage(filtered, hasNextPage = false)
              }

              // ============================== Filters ===============================

              override fun getFilterList(): FilterList = FilterList(
                  SortFilter(),
              )

              private class SortFilter : Filter.Select<String>(
                  "Trier par",
                  arrayOf("Populaires", "Récents", "A-Z"),
              ) {
                  private val vals = arrayOf("", "updated", "alpha")
                  fun toUriPart(): String = vals[state]
              }

              // =========================== Manga Details ============================

              override fun mangaDetailsParse(response: Response): SManga {
                  val doc = response.asJsoupDoc()
                  val rsc = extractNextRscPayload(doc)
                  val slug = response.request.url.pathSegments.lastOrNull().orEmpty()

                  return SManga.create().apply {
                      title = doc.selectFirst("h1")?.text()
                          ?: extractJsonString(rsc, "title")
                          ?: slug

                      val metaLine = doc.select("p, div, span")
                          .map { it.ownText() }
                          .firstOrNull { it.contains("·") && it.uppercase().contains("CHAPITRE") }

                      if (metaLine != null) {
                          val parts = metaLine.split("·").map { it.trim() }
                          author = parts.getOrNull(0)?.takeIf { it.isNotBlank() }
                          genre = parts.getOrNull(3)?.takeIf { it.isNotBlank() }
                      }

                      if (author.isNullOrBlank()) {
                          author = extractJsonString(rsc, "author")
                      }
                      if (genre.isNullOrBlank()) {
                          genre = extractJsonString(rsc, "type")
                      }

                      description = extractJsonString(rsc, "description")
                          ?: doc.select("main p")
                              .map { it.text() }
                              .firstOrNull { it.length > 40 && !it.contains("·") }

                      thumbnail_url = extractMangaCoverFromRsc(rsc)
                          ?: doc.selectFirst("main img[src*=/cover], main img")?.attr("abs:src")

                      status = SManga.UNKNOWN
                      initialized = true
                  }
              }

              // ============================== Chapters ==============================

              override fun chapterListRequest(manga: SManga): Request {
                  val mangaSlug = manga.url.trim('/').substringAfterLast('/')
                  return GET("$baseUrl/api/mangas/$mangaSlug/browse?page=1&perPage=2000&sort=recent", headers)
              }

              override fun chapterListParse(response: Response): List<SChapter> {
                  val requestUrl = response.request.url
                  val pathSegments = requestUrl.pathSegments
                  val mangaSlug = if (pathSegments.size >= 3 && pathSegments[0] == "api" && pathSegments[1] == "mangas") {
                      pathSegments[2]
                  } else {
                      pathSegments.lastOrNull().orEmpty()
                  }

                  val firstPageJson = response.body.string()
                  val allChapters = mutableListOf<SChapter>()
                  allChapters.addAll(parseChaptersFromBrowseJson(firstPageJson, mangaSlug))

                  val totalPages = TOTAL_PAGES_REGEX.find(firstPageJson)
                      ?.groupValues?.getOrNull(1)?.toIntOrNull() ?: 1

                  if (totalPages > 1) {
                      val executor = Executors.newFixedThreadPool(6)
                      try {
                          val futures = (2..totalPages).map { pageNum ->
                              executor.submit(
                                  Callable {
                                      val pageReq = GET(
                                          "$baseUrl/api/mangas/$mangaSlug/browse?page=$pageNum&perPage=2000&sort=recent",
                                          headers,
                                      )
                                      client.newCall(pageReq).execute().use { pageResp ->
                                          if (pageResp.isSuccessful) {
                                              parseChaptersFromBrowseJson(pageResp.body.string(), mangaSlug)
                                          } else {
                                              emptyList()
                                          }
                                      }
                                  },
                              )
                          }
                          for (future in futures) {
                              runCatching { allChapters.addAll(future.get()) }
                          }
                      } finally {
                          executor.shutdown()
                      }
                  }

                  return allChapters
                      .distinctBy { it.url }
                      .sortedByDescending { it.chapter_number }
              }

              // =============================== Pages ================================

              override fun pageListParse(response: Response): List<Page> {
                  val doc = response.asJsoupDoc()
                  val rsc = extractNextRscPayload(doc)

                  val rscPages = PAGE_URL_REGEX.findAll(rsc)
                      .map { it.groupValues[1] }
                      .distinct()
                      .toList()

                  if (rscPages.isNotEmpty()) {
                      return rscPages.mapIndexed { index, imageUrl ->
                          Page(index, imageUrl = imageUrl)
                      }
                  }

                  return doc.select("img[src*=/pages/], main img[src]")
                      .map { it.attr("abs:src") }
                      .filter { it.isNotBlank() && !it.contains("/cover") && !it.contains("logo") }
                      .distinct()
                      .mapIndexed { index, imageUrl ->
                          Page(index, imageUrl = imageUrl)
                      }
              }

              override fun imageUrlParse(response: Response): String =
                  throw UnsupportedOperationException("Non utilisé.")

              // ============================= Helpers ================================

              private fun Response.asJsoupDoc(): Document =
                  Jsoup.parse(body.string(), request.url.toString())

              private fun parseCatalogueFromDom(doc: Document): List<SManga> {
                  return doc.select("a[href^=/manga/]")
                      .mapNotNull { card ->
                          val href = card.attr("href").trim()
                          if (href.isEmpty() || href == "/manga" || href == "/manga/") return@mapNotNull null

                          val titleText = card.selectFirst("h3, h2, h4")?.text()
                              ?: card.selectFirst("img")?.attr("alt")?.trim()
                              ?: return@mapNotNull null

                          val coverUrl = card.selectFirst("img")?.attr("abs:src")

                          SManga.create().apply {
                              url = href
                              title = titleText
                              thumbnail_url = coverUrl
                          }
                      }
                      .distinctBy { it.url }
              }

              private fun parseCatalogueFromRsc(rsc: String): List<SManga> {
                  return MANGA_OBJECT_REGEX.findAll(rsc)
                      .map { match ->
                          val slug = match.groupValues[1]
                          val titleText = unescapeJsonText(match.groupValues[2])
                          val coverUrl = match.groupValues.getOrNull(3)?.takeIf { it.isNotBlank() }
                          SManga.create().apply {
                              url = "/manga/$slug"
                              title = titleText
                              thumbnail_url = coverUrl?.let { resolveRelativeUrl(it) }
                          }
                      }
                      .distinctBy { it.url }
                      .toList()
              }

              private fun parseChaptersFromBrowseJson(jsonStr: String, mangaSlug: String): List<SChapter> {
                  val chaptersBlock = CHAPTERS_ARRAY_REGEX.find(jsonStr)?.groupValues?.getOrNull(1)
                      ?: jsonStr

                  return JSON_OBJECT_REGEX.findAll(chaptersBlock)
                      .mapNotNull { match ->
                          val obj = match.value
                          val chapSlug = SLUG_FIELD_REGEX.find(obj)?.groupValues?.getOrNull(1)
                              ?: return@mapNotNull null
                          val chapNumStr = NUMBER_FIELD_REGEX.find(obj)?.groupValues?.getOrNull(1)
                              ?: chapSlug
                          val rawTitle = TITLE_FIELD_REGEX.find(obj)?.groupValues?.getOrNull(1).orEmpty()
                          val chapTitle = unescapeJsonText(rawTitle).trim()
                          val publishedAt = PUBLISHED_AT_FIELD_REGEX.find(obj)?.groupValues?.getOrNull(1)

                          val numFloat = chapNumStr.toFloatOrNull()
                              ?: chapSlug.toFloatOrNull()
                              ?: -1f

                          val displayNum = chapSlug.ifEmpty { chapNumStr }
                          val formattedName = if (
                              chapTitle.isNotEmpty() &&
                              !chapTitle.equals("Chapitre $displayNum", ignoreCase = true) &&
                              !chapTitle.equals(displayNum, ignoreCase = true)
                          ) {
                              "Chapitre $displayNum - $chapTitle"
                          } else {
                              "Chapitre $displayNum"
                          }

                          SChapter.create().apply {
                              url = "/$mangaSlug/$displayNum"
                              name = formattedName
                              chapter_number = numFloat
                              date_upload = parseIsoDate(publishedAt)
                          }
                      }
                      .toList()
              }

              private fun extractNextRscPayload(doc: Document): String {
                  val rawScripts = doc.select("script")
                      .map { it.data() }
                      .filter { it.contains("__next_f.push") || it.contains("__NEXT_DATA__") }
                      .joinToString("\n")

                  return rawScripts
                      .replace("\\\"", "\"")
                      .replace("\\/", "/")
                      .replace("\\n", "\n")
              }

              private fun extractJsonString(rsc: String, key: String): String? {
                  val regex = Regex("\"$key\"\\s*:\\s*\"([^\"]+)\"")
                  return regex.find(rsc)?.groupValues?.getOrNull(1)?.let { unescapeJsonText(it) }
              }

              private fun extractMangaCoverFromRsc(rsc: String): String? {
                  val cover = extractJsonString(rsc, "cover") ?: return null
                  return resolveRelativeUrl(cover)
              }

              private fun resolveRelativeUrl(urlOrPath: String): String {
                  return if (urlOrPath.startsWith("http://") || urlOrPath.startsWith("https://")) {
                      urlOrPath
                  } else {
                      "$baseUrl/${urlOrPath.trimStart('/')}"
                  }
              }

              private fun unescapeJsonText(input: String): String {
                  return input
                      .replace("\\\"", "\"")
                      .replace("\\u0026", "&")
                      .replace("\\u0027", "'")
                      .replace("\\u003c", "<")
                      .replace("\\u003e", ">")
              }

              private fun parseIsoDate(dateStr: String?): Long {
                  if (dateStr.isNullOrBlank()) return 0L
                  return runCatching { ISO_DATE_FORMAT_MS.parse(dateStr)?.time }.getOrNull()
                      ?: runCatching { ISO_DATE_FORMAT_SEC.parse(dateStr)?.time }.getOrNull()
                      ?: 0L
              }

              companion object {
                  private val PAGE_URL_REGEX = Regex(
                      "\"url\"\\s*:\\s*\"(https?://[^\"]+/chapters/[^\"]+/pages/[^\"]+)\""
                  )

                  private val CHAPTERS_ARRAY_REGEX = Regex(
                      "\"chapters\"\\s*:\\s*\\[(.*?)\\]",
                      RegexOption.DOT_MATCHES_ALL,
                  )

                  private val JSON_OBJECT_REGEX = Regex("\\{[^{}]+\\}")

                  private val TOTAL_PAGES_REGEX = Regex("\"totalPages\"\\s*:\\s*(\\d+)")

                  private val SLUG_FIELD_REGEX = Regex("\"slug\"\\s*:\\s*\"([^\"]+)\"")

                  private val NUMBER_FIELD_REGEX = Regex("\"number\"\\s*:\\s*([0-9.]+)")

                  private val TITLE_FIELD_REGEX = Regex("\"title\"\\s*:\\s*\"((?:[^\"\\\\]|\\\\.)*)\"")

                  private val PUBLISHED_AT_FIELD_REGEX = Regex("\"publishedAt\"\\s*:\\s*\"([^\"]+)\"")

                  private val MANGA_OBJECT_REGEX = Regex(
                      "\"slug\"\\s*:\\s*\"([a-z0-9-]+)\"\\s*,\\s*\"title\"\\s*:\\s*\"([^\"]+)\"[^}]*?\"cover\"\\s*:\\s*\"([^\"]+)\""
                  )

                  private val ISO_DATE_FORMAT_MS by lazy {
                      SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss.SSS'Z'", Locale.US).apply {
                          timeZone = TimeZone.getTimeZone("UTC")
                      }
                  }

                  private val ISO_DATE_FORMAT_SEC by lazy {
                      SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ss'Z'", Locale.US).apply {
                          timeZone = TimeZone.getTimeZone("UTC")
                      }
                  }
              }
          }
          EOF

      - name: Generate signing key
        run: |
          keytool -genkey -v -keystore signing.jks -alias extension \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=PunkRecords, OU=Dev, O=Tachimanga, L=Paris, S=IDF, C=FR"

      - name: Build Punk Records APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/signing.jks
          KEYSTORE_PASSPHRASE: android
          KEY_ALIAS: extension
          KEY_PASSPHRASE: android
        run: |
          chmod +x gradlew
          ./gradlew :src:fr:punkrecords:assembleRelease -x spotlessCheck -x lintRelease

      - name: Prepare Tachimanga Repo Index
        run: |
          mkdir -p repo/apk
          APK_FILE=$(find src/fr/punkrecords/build/outputs/apk/release -name "*.apk" | head -n 1)
          APK_NAME="tachiyomi-fr.punkrecords-v1.4.2.apk"
          cp "$APK_FILE" "repo/apk/$APK_NAME"
          cp "$APK_FILE" "repo/apk/tachiyomi-fr.punkrecords-v1.4.1.apk"

          cat <<EOF > repo/index.min.json
          [
            {
              "name": "Tachiyomi: Punk Records",
              "pkg": "eu.kanade.tachiyomi.extension.fr.punkrecords",
              "apk": "$APK_NAME",
              "lang": "fr",
              "code": 2,
              "version": "1.4.2",
              "nsfw": 0,
              "sources": [
                {
                  "name": "Punk Records",
                  "lang": "fr",
                  "id": "1462847678989634466",
                  "baseUrl": "https://punkrecordz.com"
                }
              ]
            }
          ]
          EOF

      - name: Publish to repo branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./repo
          publish_branch: repo
